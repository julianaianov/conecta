name: Validar aplicação

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RUNTIME_ENV: homologation
      NEXT_PUBLIC_API_URL: ""
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências dos serviços
        run: |
          for service in auth-service user-service post-service; do
            npm --prefix "services/$service" install --no-audit --no-fund
          done

      - name: Testar contrato de ambiente
        run: npm run test

      - name: Testar serviços
        run: npm run test:services

      - name: Verificar estilo
        run: npm run lint -- --max-warnings=0

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Auditar dependências
        run: npm audit --audit-level=high --omit=dev

      - name: Construir homologação
        run: npm run build

      - name: Auditar SEO das páginas públicas
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -fs -o /dev/null "$SEO_AUDIT_BASE_URL" && break
            sleep 1
          done
          npm run seo:audit

  # Publicação automática: develop → homologação, master → produção.
  # Dispara a workflow do dm-infra (que constrói as imagens, faz backup, migra
  # e sobe os containers). Só roda depois da validação acima passar.
  publicar:
    name: Publicar no servidor
    needs: validate
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar publicação no dm-infra
        env:
          # Token fine-grained com Actions: read and write só no DmConnecta/dm-infra.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret DEPLOY_DISPATCH_TOKEN ausente: a publicação automática não foi disparada."
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = master ]; then
            workflow=deploy.yml; ambiente=produção
          else
            workflow=deploy-homologation.yml; ambiente=homologação
          fi
          # A branch (não o SHA) nos dois repositórios: se uma publicação
          # pendente for substituída na fila dmconecta-host, a seguinte
          # continua levando o último commit de cada repositório.
          gh workflow run "$workflow" -R DmConnecta/dm-infra --ref "$GITHUB_REF_NAME" \
            -f app_ref="$GITHUB_REF_NAME" -f gestao_ref="$GITHUB_REF_NAME"
          echo "Publicação em $ambiente disparada: https://github.com/DmConnecta/dm-infra/actions/workflows/$workflow" >>"$GITHUB_STEP_SUMMARY"
