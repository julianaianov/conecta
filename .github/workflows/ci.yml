name: Validar aplicação

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RUNTIME_ENV: homologation
      NEXT_PUBLIC_API_URL: ""
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências dos serviços
        run: |
          for service in auth-service user-service post-service; do
            npm --prefix "services/$service" install --no-audit --no-fund
          done

      - name: Testar contrato de ambiente
        run: npm run test

      - name: Testar serviços
        run: npm run test:services

      - name: Verificar estilo
        run: npm run lint -- --max-warnings=0

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Construir homologação
        run: npm run build

      - name: Auditar SEO das páginas públicas
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -fs -o /dev/null "$SEO_AUDIT_BASE_URL" && break
            sleep 1
          done
          npm run seo:audit

  # Publicação automática: develop → homologação, master → produção, só
  # depois da validação acima passar. Chama a workflow reutilizável do
  # dm-infra (build das imagens, backup obrigatório, migrações e subida dos
  # containers). Os checkouts entre repositórios usam chaves de deploy
  # somente leitura (secrets INFRA_/APPLICATION_/GESTAO_REPO_SSH_KEY).
  publicar-homologacao:
    name: Publicar em homologação
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'develop'
    permissions:
      id-token: write
      contents: read
    uses: DmConnecta/dm-infra/.github/workflows/deploy-homologation.yml@develop
    with:
      app_ref: develop
      gestao_ref: develop
      infra_ref: develop
    secrets: inherit

  publicar-producao:
    name: Publicar em produção
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'master'
    permissions:
      id-token: write
      contents: read
    uses: DmConnecta/dm-infra/.github/workflows/deploy.yml@master
    with:
      app_ref: master
      gestao_ref: master
      infra_ref: master
    secrets: inherit
