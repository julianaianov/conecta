name: Validar aplicação

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RUNTIME_ENV: homologation
      NEXT_PUBLIC_API_URL: ""
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar contrato de ambiente
        run: npm run test

      - name: Testar serviços Node
        run: npm run test:services

      - name: Verificar estilo
        run: npm run lint -- --max-warnings=0

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Construir homologação
        run: npm run build

      - name: Auditar superfícies públicas de SEO
        run: |
          npm run start &
          node -e 'async function w(){for(let i=0;i<30;i++){try{const r=await fetch("http://127.0.0.1:3000");if(r.ok||r.status===200)process.exit(0)}catch(e){}await new Promise(r=>setTimeout(r,1000));}process.exit(1)};w();'
          npm run seo:audit
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3000

